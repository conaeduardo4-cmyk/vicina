name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm install

      - name: Configurazione (.env)
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "VITE_RESET_URL=${{ secrets.VITE_RESET_URL }}"
          } > .env

      - run: npm run build
      - run: npx cap add android
      - run: npm run native

      - run: npx cap sync android
      - name: Compila (APK debug, già installabile)
        run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vicina-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
